name: Publish approval dashboard

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synchronize GitHub work items
        run: node scripts/sync-github-work-items.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dashboard
        run: pnpm dashboard:build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_PROJECT_URL: https://github.com/users/ajhoagland2/projects/6
      - name: Preserve private dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: approval-dashboard-build
          path: apps/dashboard/dist
      - name: Configure GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
